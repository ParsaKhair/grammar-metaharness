[project]
name = "grammar-metaharness"
version = "0.1.0"
description = "MCP server that dispatches Claude Code and Codex subagents under output-format constraints"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "jsonschema>=4.20",
]

[project.scripts]
grammar-mcp = "grammar_metaharness.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grammar_metaharness"]
